<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b3a78'><link rel='manifest' href='manifest.json'><title>NGA Catalog</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#111}header{background:#0b3a78;color:white;padding:18px 16px;font-weight:800;font-size:20px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #0001}button,.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:16px;margin:10px 0;font-size:18px;font-weight:700;background:#0b3a78;color:white;text-align:center}.secondary{background:#e8edf3;color:#17202a}.danger{background:#8b1e1e}input,textarea,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd3db;border-radius:10px;font-size:16px;margin:6px 0 12px}textarea{min-height:110px}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:10px}.muted{color:#667085;font-size:14px}.row{display:flex;gap:10px}.row>*{flex:1}.hidden{display:none}.badge{display:inline-block;background:#e7f0ff;color:#0b3a78;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.status{padding:10px;border-radius:10px;background:#f2f4f7;margin:10px 0}.lot{border-top:1px solid #eee;padding:12px 0}.lot:first-child{border-top:0}</style></head><body><header>New Generation Auctions • Catalog</header><div class='wrap'>
<div id='home' class='card'><span class='badge'>iPhone-first build</span><h2>Current Auction</h2><input id='auctionName' value='New Auction' aria-label='Auction name'><button onclick="show('capture')">Take Photos / Create Lot</button><button class='secondary' onclick="show('catalog')">View Catalog</button><button class='secondary' onclick='exportCSV()'>Export Catalog CSV</button><p class='muted'>Photos → AI analysis → review → approve → next lot. Approved lots are saved on this device.</p></div>
<div id='capture' class='card hidden'><h2>Lot <span id='lotNo'>1</span></h2><label class='btn'>Take or Choose Photos<input id='photos' type='file' accept='image/*' capture='environment' multiple hidden></label><div id='thumbs' class='thumbs'></div><div id='analysisStatus' class='status hidden'></div><button id='draftBtn' onclick='analyzeLot()'>Analyze Photos & Create Lot</button><button class='secondary' onclick="show('home')">Back</button></div>
<div id='review' class='card hidden'><h2>Review Lot <span id='reviewNo'>1</span></h2><label>Title</label><input id='title'><label>Description</label><textarea id='desc'></textarea><div class='row'><div><label>Category</label><input id='category'></div><div><label>Est. Value</label><input id='value'></div></div><label>AI confidence / notes</label><textarea id='notes'></textarea><button onclick='approveLot()'>Approve & Next Lot</button><button class='secondary' onclick="show('capture')">Retake / Add Photos</button></div>
<div id='catalog' class='card hidden'><h2>Catalog</h2><div id='lots'></div><button onclick='exportCSV()'>Export Catalog CSV</button><button class='secondary' onclick="show('home')">Back</button></div>
</div><script>
let currentPhotos=[]; const $=id=>document.getElementById(id); let catalog=JSON.parse(localStorage.getItem('ngaCatalog')||'[]'); let lot=(catalog.reduce((m,x)=>Math.max(m,Number(x.lot)||0),0)||0)+1; $('lotNo').textContent=lot;
function show(id){['home','capture','review','catalog'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden'); if(id==='catalog')renderCatalog()}
$('photos').addEventListener('change',e=>{currentPhotos=[...e.target.files];$('thumbs').innerHTML='';currentPhotos.forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);$('thumbs').appendChild(im)})});
async function analyzeLot(){if(!currentPhotos.length){alert('Take at least one photo first.');return} const st=$('analysisStatus');st.classList.remove('hidden');st.textContent='Analyzing all photos for this lot…';$('draftBtn').disabled=true;try{const fd=new FormData();currentPhotos.forEach(f=>fd.append('photos',f));fd.append('lot',lot);fd.append('auctionName',$('auctionName').value);const r=await fetch('/api/analyze-lot',{method:'POST',body:fd});if(!r.ok)throw new Error('AI service is not connected yet.');const x=await r.json();fillReview(x)}catch(e){st.textContent='The iPhone capture and catalog are working. The secure AI service still needs to be deployed and connected before photo identification can run.';fillReview({title:'',description:'',category:'',estimated_value:'',notes:'AI connection pending — review fields manually for now.'})}finally{$('draftBtn').disabled=false}}
function fillReview(x){$('reviewNo').textContent=lot;$('title').value=x.title||'';$('desc').value=x.description||'';$('category').value=x.category||'';$('value').value=x.estimated_value||'';$('notes').value=x.notes||'';show('review')}
function approveLot(){catalog.push({lot,auction:$('auctionName').value,title:$('title').value,desc:$('desc').value,category:$('category').value,value:$('value').value,notes:$('notes').value,count:currentPhotos.length,createdAt:new Date().toISOString()});localStorage.setItem('ngaCatalog',JSON.stringify(catalog));lot++;$('lotNo').textContent=lot;currentPhotos=[];$('photos').value='';$('thumbs').innerHTML='';$('analysisStatus').classList.add('hidden');show('capture')}
function renderCatalog(){$('lots').innerHTML=catalog.length?catalog.map(x=>`<div class="lot"><b>Lot ${x.lot}: ${esc(x.title||'(Untitled)')}</b><div class="muted">${x.count} photos • ${esc(x.category)} • ${esc(x.value)}</div><p>${esc(x.desc)}</p></div>`).join(''):'<p class="muted">No approved lots yet.</p>'}
function exportCSV(){if(!catalog.length){alert('No approved lots to export yet.');return}const rows=[['Lot','Title','Description','Category','Estimated Value','Photo Count'],...catalog.map(x=>[x.lot,x.title,x.desc,x.category,x.value,x.count])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nga-catalog.csv';a.click()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
